<script>
   const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwJPmpab_vZmgpoclKC-DPHW-7hy7csMpi-Ew8yeXgvMotzJI71U3ax4H5tIRw2GkAo/exec";
    document.querySelector('input[type="date"]').min = new Date().toISOString().split('T')[0];

    function showFileName(input) {
        document.getElementById('fileName').textContent = input.files[0] ? '📎 ' + input.files[0].name : '';
    }

    async function submitForm(e) {
        e.preventDefault();
        const btn = document.querySelector('.submit-btn');
        btn.disabled = true;
        btn.textContent = "전송 중...";

        const form = document.getElementById('reservationForm');
        const payload = {
            name: form.querySelector('[name="name"]').value,
            phone: form.querySelector('[name="phone"]').value,
            service: Array.from(form.querySelectorAll('[name="service"]:checked')).map(c => c.value).join(', '),
            visitDate: form.querySelector('[name="visitDate"]').value,
            timeSlot: form.querySelector('[name="timeSlot"]:checked')?.value || '',
            message: form.querySelector('[name="message"]').value,
            source: "태리랜드_예약폼",
            submittedAt: new Date().toLocaleString('ko-KR')
        };

        try {
            const url = SCRIPT_URL + '?payload=' + encodeURIComponent(JSON.stringify(payload));
            await fetch(url, { mode: 'no-cors' });
        } catch(err) {
            console.log("전송완료");
        }

        document.getElementById('formBody').style.display = 'none';
        document.getElementById('submitWrap').style.display = 'none';
        document.getElementById('successScreen').style.display = 'block';
    }
</script>
